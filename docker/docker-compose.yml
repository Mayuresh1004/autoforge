services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Primary relational database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: amass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amass_secret_change_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-amass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - amass-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amass} -d ${POSTGRES_DB:-amass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis - Cache, agent memory, job queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: amass-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_change_in_production} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - amass-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_change_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Qdrant - Vector database for RAG embeddings
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: amass-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - amass-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Backend API - Express TypeScript
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: amass-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-amass}:${POSTGRES_PASSWORD:-amass_secret_change_in_production}@postgres:5432/${POSTGRES_DB:-amass}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_change_in_production}@redis:6379
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      AGENTS_URL: http://agents:8000
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - amass-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # AI Agents Service - FastAPI Python
  # ---------------------------------------------------------------------------
  agents:
    build:
      context: ..
      dockerfile: agents/Dockerfile
    container_name: amass-agents
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      AGENTS_HOST: 0.0.0.0
      AGENTS_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-amass}:${POSTGRES_PASSWORD:-amass_secret_change_in_production}@postgres:5432/${POSTGRES_DB:-amass}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_change_in_production}@redis:6379
      QDRANT_URL: http://qdrant:6333
      BACKEND_URL: http://backend:3001
    ports:
      - "${AGENTS_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - amass-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Frontend - React Vite (development mode)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: amass-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3001}
      VITE_AGENTS_URL: http://localhost:${AGENTS_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/index.html:/app/frontend/index.html
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - amass-network

networks:
  amass-network:
    driver: bridge
    name: amass-network

volumes:
  postgres_data:
    name: amass-postgres-data
  redis_data:
    name: amass-redis-data
  qdrant_data:
    name: amass-qdrant-data
